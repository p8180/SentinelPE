name: SentinelPE CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: pip install -r requirements-api.txt

      - name: Install pytest
        run: pip install pytest

      - name: Download model
        run: |
          mkdir -p models
          gh release download v1.0.0 --repo p8180/SentinelPE --pattern "best_model.pkl" --dir models
        env:
          GH_TOKEN: ${{ github.token }}  

      - name: Check downloaded model
        run: ls -lh models/best_model.pkl

      - name: Run automated tests
        run: PYTHONPATH=. python -m pytest -q tests/test_api.py
